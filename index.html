<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ennio Meccia — Digital Business Card</title>
  <style>
    :root {
      --stellantis-blue: #00235E;
      --text-dark: #1A1A1A;
      --text-muted: #555555;
      --bg-gray: #F4F7FA;
    }
    body { 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
      background-color: var(--bg-gray); 
      display: flex; justify-content: center; padding: 20px;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      border: 1px solid #E1E8EF;
      text-align: center;
    }
    .header { padding: 40px 20px 30px; }
    h1 { margin: 0; font-size: 28px; color: var(--stellantis-blue); letter-spacing: -0.5px; }
    .position { font-size: 18px; color: var(--text-muted); margin-top: 10px; font-weight: 500; }
    .company { font-size: 18px; color: var(--text-muted); margin-top: 2px; }
    .location { font-size: 14px; color: #888; margin-top: 10px; text-transform: uppercase; }
    
    .content { padding: 0 25px 35px; }
    .btn-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .btn {
      text-decoration: none;
      padding: 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      transition: all 0.2s ease;
    }
    .btn-main { background: var(--stellantis-blue); color: white; }
    .btn-outline { border: 2px solid var(--stellantis-blue); color: var(--stellantis-blue); }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }

    .scope-box {
      margin-top: 30px;
      padding: 20px;
      background: #F8FAFC;
      border-left: 4px solid var(--stellantis-blue);
      text-align: left;
      font-size: 15px;
      color: var(--text-dark);
    }
    .scope-title { color: var(--stellantis-blue); font-weight: bold; display: block; margin-bottom: 10px; }
    .scope-item { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Ennio Meccia</h1>
      <div class="position">Supply Chain Operations</div>
      <div class="company">Stellantis Europe S.p.A.</div>
      <div class="location">Torino, Italy</div>
    </div>
    
    <div class="content">
      <div class="btn-grid">
        <a href="Customizable line height
The default line height has been increased for improved accessibility. You can choose to enable a more compact line height from the view settings menu.

‎Ennio_Meccia_Stellantis_Executive.vcf‎" class="btn btn-main">💾 Save Contact</a>
        <a href="mailto:ennio.meccia@stellantis.com" class="btn btn-outline">📧 Email Me</a>
        <a href="https://linkedin.com/in/ennio-meccia-4070b76" target="_blank" class="btn btn-outline">🔗 LinkedIn Profile</a>
        <a href="tel:+393346205880" class="btn btn-outline">📞 Call Mobile</a>
      </div>

      <div class="scope-box">
        <span class="scope-title">Professional Scope:</span>
        <div class="scope-item">🌐 Global Transport Governance</div>
        <div class="scope-item">📈 Network Optimization</div>
        <div class="scope-item">💻 Digital Transformation</div>
      </div>
    </div>
  </div>
</body>
</html>
